name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - name: check the tag matches VERSION
        shell: bash
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' flow/flow.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but VERSION is $v"; exit 1; }
      - run: python build.py
      - run: dist/flow.exe --version
      - name: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/flow-*.zip --title "$GITHUB_REF_NAME" --generate-notes
