name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - name: check the tag matches VERSION
        shell: bash
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' flow/flow.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but VERSION is $v"; exit 1; }
      - run: python build.py
      - name: smoke test
        shell: bash
        run: |
          if [ -f dist/flow.exe ]; then dist/flow.exe --version; else dist/flow --version; fi
      - uses: actions/upload-artifact@v4
        with:
          name: flow-${{ matrix.os }}
          path: dist/flow-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/flow-*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
